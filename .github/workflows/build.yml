name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Ajustes do Android
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Icones
        run: |
          pip install pillow
          python scripts/make_icons.py android/app/src/main/res
      - run: npx cap sync android
      - name: Assinatura fixa e versao
        run: |
          test -f debug.keystore
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          python scripts/patch_gradle.py ${{ github.run_number }}
      - name: Compilar
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Conferir assinatura
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$($APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk)
          echo "$OUT"
          echo "$OUT" | grep -qi 2286e9f262eb9119d1215212ccd8b95371b735b0a6fd4ac411581b758146f789 || { echo "ERRO: APK nao foi assinado com a chave fixa"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: SalvO-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SalvO</title>
<style>
:root{--bg:#f1f3ee;--ink:#16221d;--mut:#66736c;--pine:#1f4a3d;--yel:#f2b705;--card:#fff;--line:#d9ded6;--ok:#2f7d5b;--warn:#b57a00;--bad:#c0392b}
body.m{--pine:#2b312e}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--pine);color:#fff;padding:18px 16px 14px;display:flex;align-items:center;gap:10px}
body.m header{background:#181c1a}body.m header h1{color:var(--yel)}
header h1{margin:0;font-size:22px;letter-spacing:.5px}
header p{margin:2px 0 0;font-size:13px;opacity:.75}
#back{display:none;background:rgba(255,255,255,.15);padding:6px 12px;font-size:22px;line-height:1}
main{padding:14px}
section{display:none}section.on{display:block}
.space{display:flex;align-items:center;gap:16px;padding:20px;border-radius:14px;margin-bottom:14px;position:relative}
.space svg{width:60px;height:60px;flex:none}
.space h3{margin:0;font-size:19px}
.space.d{background:var(--pine);color:#fff}
.space.m{background:#181c1a;color:var(--yel)}
.space.m div div{color:#d9d9d9;font-size:14px}.space.d div div{color:#d4e2dc;font-size:14px}
.pill{position:absolute;top:-8px;right:-4px;background:var(--bad);color:#fff;min-width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;padding:0 8px;border:2px solid var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:12px;margin-bottom:10px}
.card.bad{border-left-color:var(--bad)}.card.warn{border-left-color:var(--warn)}
.card h3{margin:0 0 4px;font-size:16px}
.mut{color:var(--mut);font-size:14px}
.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
h2{font-size:15px;margin:18px 0 8px;color:var(--pine)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.sm{flex:0 0 38%}
button{font:inherit;border:0;border-radius:8px;padding:12px 14px;background:var(--pine);color:#fff;font-weight:600}
button.ghost{background:#e4e9e1;color:var(--pine)}
button.mini{padding:6px 10px;font-size:14px}
button.full{width:100%;margin-top:16px}
.lot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.acts{display:flex;gap:6px;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:none;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px}
nav button.on{color:var(--pine);box-shadow:inset 0 3px 0 var(--pine)}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:#16221d;color:#fff;padding:12px;border-radius:8px;display:none;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.bar{height:8px;background:#e4e9e1;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.ck{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:15px}
.ck span{flex:1}
.ck input{width:22px;height:22px;flex:none;padding:0}
.ck:has(input:checked) span{color:var(--mut);text-decoration:line-through}
</style></head><body>
<header><button id="back" onclick="goHome()">‹</button><div><h1 id="ht">SalvO</h1><p id="hs">Escolha o que organizar</p></div></header>
<main>
<section id="s-home" class="on"></section>
<section id="s-resumo"></section>
<section id="s-itens">
  <input id="q" placeholder="Buscar produto ou local" oninput="renderItens()">
  <div id="lista" style="margin-top:12px"></div>
</section>
<section id="s-check">
  <div id="cover"></div>
  <h2>Ajustes</h2>
  <div class="row"><div><label>Pessoas</label><input id="cp" type="number" inputmode="decimal" onchange="setCfg()"></div><div><label>Meta (dias)</label><input id="cd" type="number" inputmode="decimal" onchange="setCfg()"></div></div>
  <div class="row"><div><label>Água (L/pessoa/dia; 0 = não exigir)</label><input id="cw" type="number" inputmode="decimal" step="any" onchange="setCfg()"></div><div><label>Porções/pessoa/dia</label><input id="cf" type="number" inputmode="decimal" step="any" onchange="setCfg()"></div></div>
  <p class="mut">Referência da Defesa Civil Nacional: kit para 72 horas (3 dias), com 2 litros de água por pessoa por dia.</p>
  <div class="acts"><button class="mini ghost" onclick="packRename()">Renomear mochila</button><button class="mini ghost" onclick="packDel()">Excluir mochila</button></div>
  <h2 id="chkh">Checklist</h2><div class="acts" style="margin:0 0 6px"><button class="mini ghost" id="chkbtn" onclick="chkEdit=!chkEdit;renderCheck()">Editar lista</button></div><div id="chk"></div><div id="rv" style="margin-top:14px"></div>
</section>
<section id="s-novo">
  <button class="ghost full" style="margin-top:0" onclick="scan()">Ler código de barras com a câmera</button>
  <div id="tprow"><label>Tipo</label><select id="tp" onchange="onTipo()"><option value="outro">Outro item</option><option value="agua">Água (conta na autonomia)</option><option value="alimento">Alimento (1 lata, barra ou pacote = 1 un)</option><option value="purif">Purificador de água (litros que trata)</option></select><div class="mut" id="tphint" style="margin-top:4px"></div></div>
  <label>Produto</label><input id="n" onchange="prefill()">
  <div class="row"><div><label>Quantidade</label><input id="qt" type="number" inputmode="decimal" step="any"></div>
  <div class="sm"><label>Unidade</label><select id="u"><option>kg</option><option>g</option><option>L</option><option>ml</option><option>un</option></select></div></div>
  <label>Validade</label><input id="e" type="date">
  <label>Local (prateleira, bolso, caixa...)</label><input id="loc" placeholder="Ex.: Prateleira 2, caixa B">
  <div id="mrow"><label>Consumo por mês (na mesma unidade)</label><input id="m" type="number" inputmode="decimal" step="any" placeholder="Ex.: 3"></div>
  <input id="code" type="hidden">
  <button class="full" id="savebtn" onclick="add()">Guardar</button>
  <button class="full ghost" id="cancelbtn" style="display:none;margin-top:8px" onclick="cancelEdit()">Cancelar edição</button>
</section>
</main>
<div id="toast"></div>
<nav>
  <button data-t="resumo" onclick="show('resumo')">Alertas</button>
  <button data-t="itens" onclick="show('itens')">Itens</button>
  <button data-t="check" id="navchk" onclick="show('check')">Checklist</button>
  <button data-t="novo" onclick="newItem()">Adicionar</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let items=L('sv_items')||[],rates=L('sv_rates')||{},known=L('sv_known')||{},sp=null,editId=null,chkEdit=false;
const sOf=i=>i.space||'dispensa';
const isPack=s=>!!s&&s!=='dispensa';
const P=(id=sp)=>packs.find(p=>p.id===id);
const nameOf=s=>s==='dispensa'?'Dispensa':(P(s)||{name:'Mochila'}).name;
const ICON={
 dispensa:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><rect x="9" y="6" width="46" height="52" rx="5"/><path d="M9 23h46M9 40h46"/><rect x="15" y="11" width="9" height="12" fill="currentColor" stroke="none"/><rect x="28" y="14" width="8" height="9" fill="currentColor" stroke="none"/><rect x="18" y="28" width="12" height="12" fill="currentColor" stroke="none"/><rect x="38" y="30" width="9" height="10" fill="currentColor" stroke="none"/></svg>',
 mochila:'<svg viewBox="0 0 64 64"><path d="M24 15c0-6 3-9 8-9s8 3 8 9" fill="none" stroke="currentColor" stroke-width="3.5"/><rect x="8" y="34" width="6" height="16" rx="2" fill="currentColor" opacity=".6"/><rect x="50" y="34" width="6" height="16" rx="2" fill="currentColor" opacity=".6"/><rect x="13" y="13" width="38" height="46" rx="11" fill="currentColor"/><path d="M19 30h26" stroke="#181c1a" stroke-width="2.5"/><rect x="20" y="36" width="24" height="17" rx="5" fill="#181c1a"/></svg>'};
const save=()=>{localStorage.setItem('sv_items',JSON.stringify(items));localStorage.setItem('sv_rates',JSON.stringify(rates));localStorage.setItem('sv_known',JSON.stringify(known));localStorage.setItem('sv_packs',JSON.stringify(packs));notify()};
const key=n=>n.trim().toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>(+n.toFixed(2)).toLocaleString('pt-BR');
const dleft=d=>{const t=new Date();t.setHours(12,0,0,0);return Math.round((new Date(d+'T12:00:00')-t)/864e5)};
const br=d=>d.split('-').reverse().join('/');
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const daysSince=d=>Math.round((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/864e5);
const CHK0=[['Equipamentos e ferramentas',['Apito de longo alcance','Canivete multifuncional','Lanterna de dínamo (ou com pilhas extras)','Corda (3 metros / 6 mm)','Isqueiro e velas','Capa de chuva','Garrafa de água (500 ml)','Talheres descartáveis']],['Primeiros socorros e documentos',['Manta térmica aluminizada','Máscaras (KN95 ou descartáveis)','Gaze, ataduras e curativos','Luvas descartáveis','Soro fisiológico (100 ml)','Hipoclorito de sódio (30 ml, para purificar água)','Porta-documentos impermeável (cópias de RG, CPF e certidões)','Porta-remédios (medicações de uso contínuo)']],['Higiene pessoal',['Necessaire','Escova, creme dental e fio dental','Sabonete','Pente e lixa de unha','Absorventes','Repelente','Álcool em gel']]];
let packs=L('sv_packs')||[{id:'mochila',name:'Mochila de emergência',cfg:Object.assign({p:1,d:3,w:2,f:3},L('sv_cfg')||{}),chk:L('sv_chk')||{},list:L('sv_chklist')||JSON.parse(JSON.stringify(CHK0)),rev:localStorage.getItem('sv_rev')||today()}];
function packAdd(){const n=(prompt('Nome da mochila (ex.: Mochila do Rafael)')||'').trim();if(!n)return;packs.push({id:'p'+Date.now(),name:n,cfg:{p:1,d:3,w:2,f:3},chk:{},list:JSON.parse(JSON.stringify(CHK0)),rev:today()});save();render();toast('Mochila criada. Toque nela para começar.')}
function packRename(){const p=P(),n=(prompt('Novo nome da mochila',p.name)||'').trim();if(!n)return;p.name=n;save();show('check')}
function packDel(){const p=P();if(!confirm('Excluir "'+p.name+'" e todos os itens dela?'))return;items=items.filter(i=>sOf(i)!==p.id);packs=packs.filter(x=>x.id!==p.id);save();goHome()}
function cover(p=P()){
  const cfg=p.cfg;let w=0,f=0,pu=0;
  items.filter(i=>sOf(i)===p.id&&dleft(i.exp)>=0).forEach(i=>{
    if(i.tp==='agua')w+=i.unit==='L'?i.qty:i.unit==='ml'?i.qty/1000:0;
    else if(i.tp==='purif')pu+=i.unit==='L'?i.qty:i.unit==='ml'?i.qty/1000:0;
    else if(i.tp==='alimento'&&i.unit==='un')f+=i.qty});
  const wd=cfg.w>0?(w+pu)/(cfg.p*cfg.w):Infinity,fd=f/(cfg.p*cfg.f);
  return{w,f,pu,wd,fd,days:Math.min(wd,fd)};
}
function setCfg(){
  const g=id=>{const v=parseFloat(($('#'+id).value||'').replace(',','.'));return v>0?v:null};
  const cfg=P().cfg,gw=(()=>{const v=parseFloat(($('#cw').value||'').replace(',','.'));return v>=0?v:cfg.w})();P().cfg={p:g('cp')||cfg.p,d:g('cd')||cfg.d,w:gw,f:g('cf')||cfg.f};save();setCfgInputs();render();
}
function setCfgInputs(){const cfg=P().cfg;$('#cp').value=cfg.p;$('#cd').value=cfg.d;$('#cw').value=cfg.w;$('#cf').value=cfg.f}
function chkAdd(g){const t=(prompt('Novo item')||'').trim();if(!t)return;P().list[g][1].push(t);save();renderCheck()}
function chkDel(g,i){const p=P(),t=p.list[g][1][i];p.list[g][1].splice(i,1);delete p.chk[t];save();renderCheck()}
function chkGroupAdd(){const t=(prompt('Nome do novo grupo')||'').trim();if(!t)return;P().list.push([t,[]]);save();renderCheck()}
function chkGroupDel(g){if(!confirm('Remover o grupo e todos os itens dele?'))return;const p=P();p.list[g][1].forEach(t=>delete p.chk[t]);p.list.splice(g,1);save();renderCheck()}
function chkReset(){if(!confirm('Restaurar a lista padrão? Suas alterações na lista serão perdidas.'))return;P().list=JSON.parse(JSON.stringify(CHK0));P().chk={};save();renderCheck()}
function tick(el){const c=P().chk;if(el.checked)c[el.dataset.t]=1;else delete c[el.dataset.t];save();renderCheck()}
function conferi(){P().rev=today();save();render();toast('Conferência registrada. Próximo aviso em 6 meses.')}
function tpHint(){const h={agua:'Conta em litros (L ou ml).',alimento:'1 lata, barra ou pacote = 1 porção (use a unidade un).',purif:'Informe quantos litros este item purifica (veja na embalagem). Ex.: pastilhas que tratam 12 L.'};$('#tphint').textContent=h[$('#tp').value]||''}
function onTipo(){
  tpHint();
  const t=$('#tp').value,u=$('#u').value;
  if(t==='alimento'){if(u!=='un')$('#qt').value=1;$('#u').value='un'}
  else if((t==='agua'||t==='purif')&&u!=='L'&&u!=='ml')$('#u').value='L';
}
function renderCheck(){
  const p=P(),cfg=p.cfg,chk=p.chk,rev=p.rev,chkList=p.list,v=cover(p),bar=(x,m)=>`<div class="bar"><i style="width:${Math.min(100,x/m*100)}%"></i></div>`;
  const nw=Math.max(0,cfg.d*cfg.p*cfg.w-v.w-v.pu),nf=Math.max(0,cfg.d*cfg.p*cfg.f-v.f),ok=nw<0.001&&nf<0.001;
  $('#cover').innerHTML=`<div class="card ${ok?'':'warn'}"><h3>Autonomia: ${num(v.days)} de ${cfg.d} dias</h3>
  <div class="mut">Água: ${num(v.w)} L${v.pu?' + '+num(v.pu)+' L purificáveis':''}${cfg.w>0?' · '+num(v.wd)+' dia(s)':' (não entra na meta)'}</div>${cfg.w>0?bar(v.wd,cfg.d):''}
  <div class="mut" style="margin-top:8px">Alimento: ${num(v.f)} porções · ${num(v.fd)} dia(s)</div>${bar(v.fd,cfg.d)}
  <div style="margin-top:8px" class="${ok?'':'warn-t'}">${ok?'Mochila pronta para '+cfg.d+' dias.':'Faltam '+(nw>=0.001?num(nw)+' L de água':'')+(nw>=0.001&&nf>=0.001?' e ':'')+(nf>=0.001?num(nf)+' porções de alimento':'')+'.'}</div>
  <div class="mut" style="margin-top:6px">Só conta o que está dentro da validade. Cadastre água, alimentos e purificadores em Adicionar, escolhendo o tipo. Litros purificáveis só ajudam se houver água para tratar.</div></div>`;
  let tot=0,done=0,h='';
  chkList.forEach(([t,l],gi)=>{
    h+=`<h2>${esc(t)}${chkEdit?` <button class="mini" onclick="chkAdd(${gi})">+ Item</button> <button class="mini ghost" onclick="chkGroupDel(${gi})">Remover grupo</button>`:''}</h2>`;
    l.forEach((x,ii)=>{tot++;if(chk[x])done++;
      h+=chkEdit?`<div class="ck"><span>${esc(x)}</span><button class="mini ghost" onclick="chkDel(${gi},${ii})">Tirar</button></div>`
        :`<label class="ck"><input type="checkbox" ${chk[x]?'checked':''} data-t="${esc(x)}" onchange="tick(this)"><span>${esc(x)}</span></label>`})});
  if(chkEdit)h+='<div class="acts" style="margin-top:12px"><button class="mini" onclick="chkGroupAdd()">+ Novo grupo</button><button class="mini ghost" onclick="chkReset()">Restaurar padrão</button></div>';
  $('#chkbtn').textContent=chkEdit?'Concluir edição':'Editar lista';
  $('#chkh').textContent=`Checklist (${done}/${tot})`;$('#chk').innerHTML=h;
  $('#rv').innerHTML=`<div class="card ${daysSince(rev)>180?'warn':''}"><h3>Revisão da mochila</h3><div class="mut">Última conferência: ${br(rev)}. A Defesa Civil recomenda conferir as validades a cada 6 meses.</div><div class="acts"><button class="mini" onclick="conferi()">Conferi hoje</button></div></div>`;
}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3500)}

function show(t){
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('nav').style.display=t==='home'?'none':'flex';$('#back').style.display=t==='home'?'none':'block';
  document.body.className=isPack(sp)?'m':'';
  $('#savebtn').textContent=editId?'Salvar alterações':'Guardar';$('#cancelbtn').style.display=editId?'block':'none';
  $('#ht').textContent=sp?nameOf(sp):'SalvO';$('#hs').textContent=sp?(isPack(sp)?'Itens para levar em uma emergência':'Seus alimentos e validades'):'Escolha o que organizar';
  $('#mrow').style.display=isPack(sp)?'none':'block';$('#tprow').style.display=isPack(sp)?'block':'none';$('#navchk').style.display=isPack(sp)?'':'none';if(isPack(sp))setCfgInputs();
  $('#loc').placeholder=isPack(sp)?'Ex.: bolso da frente':'Ex.: Prateleira 2, caixa B';
  render();
}
function openSp(s){sp=s;show('resumo')}
function goHome(){sp=null;show('home')}

function groups(s){
  const g={};items.filter(i=>sOf(i)===s).forEach(i=>{(g[key(i.name)]??=[]).push(i)});
  return Object.entries(g).map(([k,lots])=>{
    lots.sort((a,b)=>a.exp.localeCompare(b.exp));
    const r=s==='dispensa'?rates[k]:null,perDay=r&&r.m>0?r.m/30:0;
    let prev=0,waste=0,total=0;
    lots.forEach(l=>{
      const d=dleft(l.exp);l.d=d;
      const eaten=perDay?Math.min(l.qty,Math.max(0,perDay*Math.max(d,0)-prev)):0;
      l.waste=perDay?l.qty-eaten:(d<0?l.qty:0);
      if(d>=0)prev+=l.qty;total+=l.qty;waste+=l.waste;
    });
    return{k,name:lots[0].name,unit:lots[0].unit,lots,total,waste,perDay,left:perDay?total/perDay:null};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
function alerts(s){
  const gs=groups(s),lim=isPack(s)?30:7;
  return{gs,lim,
    exp:gs.filter(g=>g.lots.some(l=>l.d<0)),
    risk:gs.filter(g=>g.perDay&&g.lots.some(l=>l.d>=0&&l.waste>0.005)),
    soon:gs.filter(g=>!g.perDay&&g.lots.some(l=>l.d>=0&&l.d<=lim)),
    low:isPack(s)?[]:gs.filter(g=>g.perDay&&g.left<10),
    cov:isPack(s)&&cover(P(s)).days<P(s).cfg.d-0.001,rev:isPack(s)&&daysSince(P(s).rev)>180};
}

function renderHome(){
  $('#s-home').innerHTML=['dispensa',...packs.map(p=>p.id)].map(s=>{
    const a=alerts(s),c=a.exp.length+a.risk.length+a.soon.length+a.low.length+(a.cov?1:0)+(a.rev?1:0),n=items.filter(i=>sOf(i)===s).length;
    return `<div class="space ${s==='dispensa'?'d':'m'}" onclick="openSp('${s}')">${ICON[isPack(s)?'mochila':'dispensa']}<div><h3>${esc(nameOf(s))}</h3><div>${n} item(ns)${isPack(s)?' · autonomia '+num(cover(P(s)).days)+' de '+P(s).cfg.d+' dias':''}${c?' · '+c+' alerta(s)':''}</div></div>${c?`<span class="pill">${c}</span>`:''}</div>`}).join('')+'<button class="ghost full" onclick="packAdd()">+ Nova mochila</button>';
}
function renderResumo(){
  const a=alerts(sp);let h='';
  if(a.cov){const cfg=P().cfg,v=cover(),nw=Math.max(0,cfg.d*cfg.p*cfg.w-v.w-v.pu),nf=Math.max(0,cfg.d*cfg.p*cfg.f-v.f),lim=cfg.w>0&&v.wd<v.fd?'água':'alimento';h+=`<h2>Autonomia da mochila</h2><div class="card warn"><h3>Cobre ${num(v.days)} de ${cfg.d} dias</h3><div class="mut">Limitado por ${lim}.${nw>=0.001?' Faltam '+num(nw)+' L de água.':''}${nf>=0.001?' Faltam '+num(nf)+' porções de alimento.':''} Você tem ${num(v.w)} L de água${v.pu?' (+'+num(v.pu)+' L purificáveis)':''} e ${num(v.f)} porções.</div></div>`}
  if(a.rev)h+=`<h2>Revisão</h2><div class="card warn"><h3>Hora de revisar a mochila</h3><div class="mut">Última conferência há ${daysSince(P().rev)} dias. Confira validades e o checklist.</div></div>`;
  if(a.exp.length){h+='<h2>Vencidos</h2>';a.exp.forEach(g=>g.lots.filter(l=>l.d<0).forEach(l=>h+=`<div class="card bad"><h3>${esc(g.name)}</h3><span class="bad-t">${num(l.qty)} ${g.unit} venceu em ${br(l.exp)}</span><div class="mut">${esc(l.loc||'')}</div></div>`))}
  if(a.risk.length){h+='<h2>Risco de perda</h2>';a.risk.forEach(g=>{
    const w=g.lots.filter(l=>l.d>=0).reduce((s,l)=>s+l.waste,0),f=g.lots.find(l=>l.d>=0&&l.waste>0.005);
    h+=`<div class="card warn"><h3>${esc(g.name)}</h3><span class="warn-t">Pode sobrar ~${num(w)} ${g.unit}</span><div class="mut">Você tem ${num(g.total)} ${g.unit}, usa ${num(rates[g.k].m)}/mês. Lote de ${br(f.exp)} vence em ${f.d} dia(s). Use mais ou doe.</div></div>`})}
  if(a.soon.length){h+='<h2>Vencem em breve</h2>';a.soon.forEach(g=>{const l=g.lots.find(l=>l.d>=0&&l.d<=a.lim);
    h+=`<div class="card warn"><h3>${esc(g.name)}</h3><span class="warn-t">Vence em ${l.d} dia(s)</span><div class="mut">${num(l.qty)} ${g.unit}${l.loc?' · '+esc(l.loc):''}. ${isPack(sp)?'Troque por um item novo.':'Informe o consumo mensal para um alerta melhor.'}</div></div>`})}
  if(a.low.length){h+='<h2>Reposição</h2>';a.low.forEach(g=>h+=`<div class="card"><h3>${esc(g.name)}</h3><span>Estoque dura ~${Math.max(1,Math.floor(g.left))} dia(s)</span><div class="mut">Restam ${num(g.total)} ${g.unit}.</div></div>`)}
  if(!h)h=a.gs.length?'<div class="empty">Tudo certo por aqui. Nenhum alerta no momento.</div>':'<div class="empty">Nada cadastrado ainda.<br>Toque em Adicionar para começar.</div>';
  $('#s-resumo').innerHTML=h;
}
function renderItens(){
  if(!sp)return;
  const q=($('#q').value||'').toLowerCase();let h='';
  groups(sp).filter(g=>!q||g.k.includes(q)||g.lots.some(l=>(l.loc||'').toLowerCase().includes(q))).forEach(g=>{
    const r=sp==='dispensa'?rates[g.k]:null;
    h+=`<div class="card ${g.lots.some(l=>l.d<0)?'bad':g.waste>0.005?'warn':''}"><h3>${esc(g.name)} · ${num(g.total)} ${g.unit}</h3>${sp==='dispensa'?`<div class="mut">${r&&r.m?'Consumo: '+num(r.m)+' '+g.unit+'/mês':'Sem consumo informado'}</div>`:''}`;
    g.lots.forEach(l=>h+=`<div class="lot"><span><b>${esc(l.loc||'Sem local')}</b><br>${num(l.qty)} ${l.unit} · vence ${br(l.exp)} <span class="${l.d<0?'bad-t':l.d<=7?'warn-t':'mut'}">(${l.d<0?'vencido':l.d+' d'})</span></span><span style="display:flex;gap:6px"><button class="mini ghost" onclick="edit(${l.id})">Editar</button><button class="mini ghost" onclick="del(${l.id})">Remover</button></span></div>`);
    h+=`<div class="acts"><button class="mini" data-k="${esc(g.k)}" onclick="use(this.dataset.k)">Usei</button>${sp==='dispensa'?`<button class="mini ghost" data-k="${esc(g.k)}" onclick="rate(this.dataset.k)">Consumo</button>`:''}</div></div>`;
  });
  $('#lista').innerHTML=h||'<div class="empty">Nada encontrado.</div>';
}
function render(){if(!sp)renderHome();else{renderResumo();renderItens();if(isPack(sp))renderCheck()}}

function use(k){
  const g=groups(sp).find(x=>x.k===k);if(!g)return;
  const a=parseFloat((prompt(`Quanto você usou? (${g.unit})`,'')||'').replace(',','.'));
  if(!(a>0))return;
  let rest=a;
  for(const l of g.lots){const it=items.find(i=>i.id===l.id);const t=Math.min(it.qty,rest);it.qty-=t;rest-=t;if(rest<=0)break}
  items=items.filter(i=>i.qty>0.0001);save();render();toast('Baixa registrada (o lote que vence primeiro sai primeiro)');
}
function rate(k){
  const g=groups(sp).find(x=>x.k===k);
  const a=prompt(`Consumo por mês de ${g.name} (${g.unit})`,rates[k]?rates[k].m:'');
  if(a===null)return;rates[k]={m:parseFloat(a.replace(',','.'))||0,unit:g.unit};save();render();
}
function clearForm(){['n','qt','e','loc','m','code'].forEach(i=>$('#'+i).value='');$('#tp').value='outro';tpHint();editId=null}
function newItem(){clearForm();show('novo')}
function cancelEdit(){clearForm();show('itens')}
function edit(id){
  const i=items.find(x=>x.id===id);if(!i)return;
  clearForm();editId=id;
  $('#n').value=i.name;$('#qt').value=i.qty;$('#u').value=i.unit;$('#e').value=i.exp;$('#loc').value=i.loc||'';$('#code').value=i.code||'';
  $('#tp').value=i.tp||'outro';tpHint();
  const r=sp==='dispensa'&&rates[key(i.name)];if(r&&r.m)$('#m').value=r.m;
  show('novo');
}
function del(id){if(confirm('Remover este lote?')){items=items.filter(i=>i.id!==id);save();render()}}

function prefill(){const r=sp==='dispensa'&&rates[key($('#n').value)];if(r){$('#u').value=r.unit;if(r.m)$('#m').value=r.m}}
function add(){
  const name=$('#n').value.trim(),qty=parseFloat($('#qt').value),exp=$('#e').value;
  if(!name||!(qty>0)||!exp)return toast('Preencha produto, quantidade e validade.');
  const u=$('#u').value,code=$('#code').value;
  const tp=isPack(sp)?$('#tp').value:undefined,loc=$('#loc').value.trim(),cur=editId&&items.find(x=>x.id===editId);
  if(cur)Object.assign(cur,{tp,name,qty,unit:u,exp,loc,code:code||cur.code});
  else items.push({id:Date.now(),space:sp,tp,name,qty,unit:u,exp,loc,code});
  const m=parseFloat($('#m').value);
  if(sp==='dispensa'&&m>=0&&$('#m').value!=='')rates[key(name)]={m,unit:u};
  if(code)known[code]={name,unit:u};
  save();const was=!!cur;clearForm();
  toast(was?'Alterações salvas!':'Guardado!');show('itens');
}

async function scan(){
  const B=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.BarcodeScanner;
  if(!B)return toast('O scanner só funciona no app instalado.');
  try{
    try{const a=await B.isGoogleBarcodeScannerModuleAvailable();
      if(!a.available){await B.installGoogleBarcodeScannerModule();return toast('Baixando o módulo do scanner. Tente de novo em alguns segundos.')}}catch(e){}
    const r=await B.scan();
    const code=r.barcodes&&r.barcodes[0]&&r.barcodes[0].rawValue;if(!code)return;
    $('#code').value=code;
    if(known[code]){$('#n').value=known[code].name;$('#u').value=known[code].unit;prefill();return toast('Produto reconhecido.')}
    toast('Buscando produto...');
    const res=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,quantity`);
    const j=await res.json();
    if(j.status===1&&j.product){
      const p=j.product;$('#n').value=[p.product_name,p.brands&&p.brands.split(',')[0]].filter(Boolean).join(' - ');
      const m=(p.quantity||'').match(/([\d.,]+)\s*(kg|g|l|ml)/i);
      if(m){$('#qt').value=m[1].replace(',','.');const un=m[2].toLowerCase();$('#u').value=un==='l'?'L':un}
      prefill();toast('Produto encontrado. Confira e informe a validade.');
    }else toast('Produto não encontrado. Digite o nome uma vez e o app lembra.');
  }catch(e){toast('Não foi possível ler: '+(e.message||e))}
}

/* Notificações: reagendadas a cada alteração e ao abrir o app */
function notify(){clearTimeout(notify.t);notify.t=setTimeout(doNotify,800)}
async function doNotify(){
  const N=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!N)return;
  try{
    let p=await N.checkPermissions();
    if(p.display!=='granted'){p=await N.requestPermissions();if(p.display!=='granted')return}
    const pend=await N.getPending();
    if(pend.notifications.length)await N.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const now=Date.now(),list=[];let id=1;
    const push=(date,title,body)=>{if(date.getTime()>now&&list.length<300)list.push({id:id++,title,body,schedule:{at:date,allowWhileIdle:true}})};
    const n9=new Date();n9.setHours(9,0,0,0);if(n9.getTime()<=now)n9.setDate(n9.getDate()+1);
    const n9b=new Date(n9);n9b.setDate(n9b.getDate()+3);
    ['dispensa',...packs.map(p=>p.id)].forEach(s=>{
      const offs=isPack(s)?[30,7,0]:[7,3,1,0],tt=nameOf(s);
      groups(s).forEach(g=>{
        g.lots.forEach(l=>{
          const info=`${num(l.qty)} ${l.unit}${l.loc?' · '+l.loc:''}`;
          if(l.d<0)push(n9,`${tt}: ${g.name} venceu`,info);
          else offs.forEach(o=>{const d=new Date(l.exp+'T09:00:00');d.setDate(d.getDate()-o);push(d,`${tt}: ${g.name} ${o?'vence em '+o+' dia(s)':'vence hoje'}`,info)});
        });
        const w=g.lots.filter(l=>l.d>=0).reduce((a,l)=>a+l.waste,0);
        if(g.perDay&&w>0.005){const m=`Pode sobrar ~${num(w)} ${g.unit}. Use mais ou doe.`;push(n9,`Dispensa: risco de perder ${g.name}`,m);push(n9b,`Dispensa: risco de perder ${g.name}`,m)}
      });
    });
    packs.forEach(p=>{const d=new Date(p.rev+'T09:00:00');d.setDate(d.getDate()+180);push(d,p.name+': hora de revisar','Confira as validades e o checklist.')});
    if(list.length)await N.schedule({notifications:list});
  }catch(e){}
}
render();notify();
</script></body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SalvO</title>
<style>
:root{--bg:#f1f3ee;--ink:#16221d;--mut:#66736c;--pine:#1f4a3d;--card:#fff;--line:#d9ded6;--ok:#2f7d5b;--warn:#b57a00;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--pine);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:22px;letter-spacing:.5px}
header p{margin:2px 0 0;font-size:13px;opacity:.75}
main{padding:14px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:12px;margin-bottom:10px}
.card.bad{border-left-color:var(--bad)}.card.warn{border-left-color:var(--warn)}
.card h3{margin:0 0 4px;font-size:16px}
.mut{color:var(--mut);font-size:14px}
.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}.ok-t{color:var(--ok)}
h2{font-size:15px;margin:18px 0 8px;color:var(--pine)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.sm{flex:0 0 38%}
button{font:inherit;border:0;border-radius:8px;padding:12px 14px;background:var(--pine);color:#fff;font-weight:600}
button.ghost{background:#e4e9e1;color:var(--pine)}
button.mini{padding:6px 10px;font-size:14px}
button.full{width:100%;margin-top:16px}
.lot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.acts{display:flex;gap:6px;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px}
nav button.on{color:var(--pine);box-shadow:inset 0 3px 0 var(--pine)}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:#16221d;color:#fff;padding:12px;border-radius:8px;display:none;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style></head><body>
<header><h1>SalvO</h1><p>Sua dispensa, sem desperdício</p></header>
<main>
<section id="s-resumo" class="on"></section>
<section id="s-dispensa">
  <input id="q" placeholder="Buscar produto ou local (ex.: feijão, prateleira 2)" oninput="renderDispensa()">
  <div id="lista" style="margin-top:12px"></div>
</section>
<section id="s-novo">
  <button class="ghost full" style="margin-top:0" onclick="scan()">Ler código de barras com a câmera</button>
  <label>Produto</label><input id="n" onchange="prefill()">
  <div class="row"><div><label>Quantidade</label><input id="qt" type="number" inputmode="decimal" step="any"></div>
  <div class="sm"><label>Unidade</label><select id="u"><option>kg</option><option>g</option><option>L</option><option>ml</option><option>un</option></select></div></div>
  <label>Validade</label><input id="e" type="date">
  <label>Local (prateleira, caixa...)</label><input id="loc" placeholder="Ex.: Prateleira 2, caixa B">
  <label>Consumo por mês (na mesma unidade)</label><input id="m" type="number" inputmode="decimal" step="any" placeholder="Ex.: 3">
  <input id="code" type="hidden">
  <button class="full" onclick="add()">Guardar na dispensa</button>
</section>
</main>
<div id="toast"></div>
<nav>
  <button class="on" data-t="resumo" onclick="show('resumo')">Alertas</button>
  <button data-t="dispensa" onclick="show('dispensa')">Dispensa</button>
  <button data-t="novo" onclick="show('novo')">Adicionar</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let items=L('sv_items')||[],rates=L('sv_rates')||{},known=L('sv_known')||{};
const save=()=>{localStorage.setItem('sv_items',JSON.stringify(items));localStorage.setItem('sv_rates',JSON.stringify(rates));localStorage.setItem('sv_known',JSON.stringify(known))};
const key=n=>n.trim().toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>(+n.toFixed(2)).toLocaleString('pt-BR');
const dleft=d=>{const t=new Date();t.setHours(12,0,0,0);return Math.round((new Date(d+'T12:00:00')-t)/864e5)};
const br=d=>d.split('-').reverse().join('/');
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3500)}
function show(t){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}

function groups(){
  const g={};items.forEach(i=>{(g[key(i.name)]??=[]).push(i)});
  return Object.entries(g).map(([k,lots])=>{
    lots.sort((a,b)=>a.exp.localeCompare(b.exp));
    const r=rates[k],perDay=r&&r.m>0?r.m/30:0;
    let prev=0,waste=0,total=0;
    lots.forEach(l=>{
      const d=dleft(l.exp);l.d=d;
      const eaten=perDay?Math.min(l.qty,Math.max(0,perDay*Math.max(d,0)-prev)):0;
      l.waste=perDay?l.qty-eaten:(d<0?l.qty:0);
      if(d>=0)prev+=l.qty;total+=l.qty;waste+=l.waste;
    });
    return{k,name:lots[0].name,unit:lots[0].unit,lots,total,waste,perDay,left:perDay?total/perDay:null,first:lots[0].d};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

function renderResumo(){
  const gs=groups();let h='';
  const exp=gs.filter(g=>g.lots.some(l=>l.d<0));
  const risk=gs.filter(g=>g.perDay&&g.lots.some(l=>l.d>=0&&l.waste>0.005));
  const soon=gs.filter(g=>!g.perDay&&g.first>=0&&g.first<=7);
  const low=gs.filter(g=>g.perDay&&g.left<10);
  if(exp.length){h+='<h2>Vencidos</h2>';exp.forEach(g=>g.lots.filter(l=>l.d<0).forEach(l=>h+=`<div class="card bad"><h3>${esc(g.name)}</h3><span class="bad-t">${num(l.qty)} ${g.unit} venceu em ${br(l.exp)}</span><div class="mut">${esc(l.loc||'')}</div></div>`))}
  if(risk.length){h+='<h2>Risco de perda</h2>';risk.forEach(g=>{
    const w=g.lots.filter(l=>l.d>=0).reduce((s,l)=>s+l.waste,0);
    const f=g.lots.find(l=>l.d>=0&&l.waste>0.005);
    h+=`<div class="card warn"><h3>${esc(g.name)}</h3><span class="warn-t">Pode sobrar ~${num(w)} ${g.unit}</span><div class="mut">Você tem ${num(g.total)} ${g.unit}, usa ${num(rates[g.k].m)}/mês. Lote de ${br(f.exp)} vence em ${f.d} dia(s). Use mais ou doe.</div></div>`})}
  if(soon.length){h+='<h2>Vencem em breve</h2>';soon.forEach(g=>h+=`<div class="card warn"><h3>${esc(g.name)}</h3><span class="warn-t">Vence em ${g.first} dia(s)</span><div class="mut">${num(g.total)} ${g.unit}. Informe o consumo mensal para um alerta melhor.</div></div>`)}
  if(low.length){h+='<h2>Reposição</h2>';low.forEach(g=>h+=`<div class="card"><h3>${esc(g.name)}</h3><span>Estoque dura ~${Math.max(1,Math.floor(g.left))} dia(s)</span><div class="mut">Restam ${num(g.total)} ${g.unit}.</div></div>`)}
  if(!h)h=items.length?'<div class="empty">Tudo certo por aqui. Nenhum alerta no momento.</div>':'<div class="empty">Dispensa vazia.<br>Toque em Adicionar para cadastrar o primeiro produto.</div>';
  $('#s-resumo').innerHTML=h;
}

function renderDispensa(){
  const q=($('#q').value||'').toLowerCase();let h='';
  groups().filter(g=>!q||g.k.includes(q)||g.lots.some(l=>(l.loc||'').toLowerCase().includes(q))).forEach(g=>{
    const r=rates[g.k];
    h+=`<div class="card ${g.lots.some(l=>l.d<0)?'bad':g.waste>0.005?'warn':''}"><h3>${esc(g.name)} · ${num(g.total)} ${g.unit}</h3><div class="mut">${r&&r.m?'Consumo: '+num(r.m)+' '+g.unit+'/mês':'Sem consumo informado'}</div>`;
    g.lots.forEach(l=>h+=`<div class="lot"><span><b>${esc(l.loc||'Sem local')}</b><br>${num(l.qty)} ${l.unit} · vence ${br(l.exp)} <span class="${l.d<0?'bad-t':l.d<=7?'warn-t':'mut'}">(${l.d<0?'vencido':l.d+' d'})</span></span><button class="mini ghost" onclick="del(${l.id})">Remover</button></div>`);
    h+=`<div class="acts"><button class="mini" onclick="use('${esc(g.k).replace(/'/g,"\\'")}')">Usei</button><button class="mini ghost" onclick="rate('${esc(g.k).replace(/'/g,"\\'")}')">Consumo</button></div></div>`;
  });
  $('#lista').innerHTML=h||'<div class="empty">Nada encontrado.</div>';
}
function render(){renderResumo();renderDispensa()}

function use(k){
  const g=groups().find(x=>x.k===k);if(!g)return;
  const a=parseFloat((prompt(`Quanto você usou? (${g.unit})`,'')||'').replace(',','.'));
  if(!(a>0))return;
  let rest=a;
  for(const l of g.lots){const it=items.find(i=>i.id===l.id);const t=Math.min(it.qty,rest);it.qty-=t;rest-=t;if(rest<=0)break}
  items=items.filter(i=>i.qty>0.0001);save();render();toast('Baixa registrada (o lote que vence primeiro sai primeiro)');
}
function rate(k){
  const g=groups().find(x=>x.k===k);
  const a=prompt(`Consumo por mês de ${g.name} (${g.unit})`,rates[k]?rates[k].m:'');
  if(a===null)return;rates[k]={m:parseFloat(a.replace(',','.'))||0,unit:g.unit};save();render();
}
function del(id){if(confirm('Remover este lote?')){items=items.filter(i=>i.id!==id);save();render()}}

function prefill(){const r=rates[key($('#n').value)];if(r){$('#u').value=r.unit;if(r.m)$('#m').value=r.m}}
function add(){
  const name=$('#n').value.trim(),qty=parseFloat($('#qt').value),exp=$('#e').value;
  if(!name||!(qty>0)||!exp)return toast('Preencha produto, quantidade e validade.');
  const u=$('#u').value,code=$('#code').value;
  items.push({id:Date.now(),name,qty,unit:u,exp,loc:$('#loc').value.trim(),code});
  const m=parseFloat($('#m').value);
  if(m>=0&&$('#m').value!=='')rates[key(name)]={m,unit:u};
  if(code)known[code]={name,unit:u};
  save();['n','qt','e','loc','m','code'].forEach(i=>$('#'+i).value='');
  toast('Guardado!');show('dispensa');
}

async function scan(){
  const B=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.BarcodeScanner;
  if(!B)return toast('O scanner só funciona no app instalado.');
  try{
    try{const a=await B.isGoogleBarcodeScannerModuleAvailable();
      if(!a.available){await B.installGoogleBarcodeScannerModule();return toast('Baixando o módulo do scanner. Tente de novo em alguns segundos.')}}catch(e){}
    const r=await B.scan();
    const code=r.barcodes&&r.barcodes[0]&&r.barcodes[0].rawValue;if(!code)return;
    $('#code').value=code;
    if(known[code]){$('#n').value=known[code].name;$('#u').value=known[code].unit;prefill();return toast('Produto reconhecido.')}
    toast('Buscando produto...');
    const res=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,quantity`);
    const j=await res.json();
    if(j.status===1&&j.product){
      const p=j.product;$('#n').value=[p.product_name,p.brands&&p.brands.split(',')[0]].filter(Boolean).join(' - ');
      const m=(p.quantity||'').match(/([\d.,]+)\s*(kg|g|l|ml)/i);
      if(m){$('#qt').value=m[1].replace(',','.');const un=m[2].toLowerCase();$('#u').value=un==='l'?'L':un}
      prefill();toast('Produto encontrado. Confira e informe a validade.');
    }else toast('Produto não encontrado. Digite o nome uma vez e o app lembra.');
  }catch(e){toast('Não foi possível ler: '+(e.message||e))}
}
render();
</script></body></html>
